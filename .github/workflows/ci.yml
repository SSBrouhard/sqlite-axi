name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  notify-openbot:
    needs: test
    if: ${{ always() && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.test.result == 'failure') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send main CI failure to OpenBot
        env:
          OPENBOT_URL: ${{ vars.OPENBOT_CI_WEBHOOK_URL }}
          OPENBOT_SECRET: ${{ secrets.OPENBOT_CI_WEBHOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json, os, time, urllib.error, urllib.request

          url = os.environ['OPENBOT_URL']
          secret = os.environ['OPENBOT_SECRET']
          if not url or not secret:
              raise SystemExit('OpenBot webhook URL or secret is missing')
          repository = os.environ['REPOSITORY']
          run_id, attempt = os.environ['RUN_ID'], os.environ['RUN_ATTEMPT']
          delivery = f'github-{run_id}-{attempt}'
          body = json.dumps({'type': 'github.ci.failure', 'data': {
              'repository': repository, 'branch': 'main', 'conclusion': 'failure',
              'test': os.environ['EVENT_NAME'] == 'workflow_dispatch',
              'run_url': f"{os.environ['SERVER_URL']}/{repository}/actions/runs/{run_id}",
          }}, separators=(',', ':')).encode()
          for wait in (0, 15, 45):
              if wait:
                  time.sleep(wait)
              stamp = str(int(time.time()))
              signed = stamp.encode() + b'.' + delivery.encode() + b'.' + body
              signature = hmac.new(secret.encode(), signed, hashlib.sha256).hexdigest()
              request = urllib.request.Request(url, data=body, headers={
                  'Content-Type': 'application/json', 'X-OpenBot-Timestamp': stamp,
                  'X-OpenBot-Delivery-Id': delivery,
                  'X-OpenBot-Signature': 'sha256=' + signature,
              })
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      if response.status in (200, 202):
                          print('OpenBot accepted or already recorded the delivery')
                          break
                      raise SystemExit(f'Unexpected HTTP status: {response.status}')
              except urllib.error.HTTPError as error:
                  if error.code not in (429, 503):
                      raise SystemExit(f'OpenBot rejected the delivery: HTTP {error.code}')
              except urllib.error.URLError:
                  pass
          else:
              raise SystemExit('OpenBot unavailable after retries; event needs manual review')
          PY
